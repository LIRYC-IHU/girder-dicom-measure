name: CI

on:
  push:
    branches: [main]
    # Sans ce filtre, un push de tag ne déclenche rien : `branches` seul ignore les tags,
    # et le job `release` ci-dessous ne s'exécuterait jamais.
    tags: ['v*']
  pull_request:

jobs:
  web:
    name: SPA (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  plugin:
    name: Plugin Girder (py_compile · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Encodeurs utilisés par le transcodage des pixels (cf. transcode.py) : sans eux, les
      # tests de compression seraient silencieusement dégradés.
      - run: pip install pydicom numpy pyjpegls pylibjpeg pylibjpeg-openjpeg pytest
      - run: python -m py_compile girder_dicom_measure_flow/*.py
      - run: python -m pytest -q

  package:
    name: Wheel (SPA embarquée)
    runs-on: ubuntu-latest
    needs: [web, plugin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # `make build` construit la SPA puis la copie dans plugin/.../web_dist, d'où
      # le package-data la reprend. Sans cette étape le wheel s'installe quand même,
      # mais Girder démarre sans viewer ni intégration vue item.
      - run: npm ci
        working-directory: web
      - run: make build
      - run: pip install build
      - run: python -m build plugin
      - name: Le wheel doit embarquer la SPA
        run: |
          whl=$(ls plugin/dist/*.whl)
          echo "Vérification de $whl"
          for f in web_dist/index.html web_dist/girder-link.js; do
            unzip -l "$whl" | grep -q "$f" \
              || { echo "::error::$f absent du wheel — la SPA n'a pas été construite avant le packaging"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: girder-dicom-measure-flow-wheel
          path: plugin/dist/*

  release:
    name: Publication du wheel sur la release
    # Uniquement sur tag `vX.Y.Z` : le wheel publié devient l'artefact que consomme le
    # déploiement (cf. girder-define-pfa/docker/girder/Dockerfile.prod).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: girder-dicom-measure-flow-wheel
          path: dist
      # L'URL de téléchargement contient la version : un tag qui ne correspond pas à
      # `plugin/pyproject.toml` publierait un asset introuvable par le déploiement.
      - name: Le tag doit correspondre à la version du wheel
        run: |
          tag="${GITHUB_REF_NAME#v}"
          whl=$(ls dist/*.whl)
          version=$(basename "$whl" | cut -d- -f2)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME != version du wheel ($version) — bumper plugin/pyproject.toml avant de taguer"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME == version $version"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
