[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "girder-dicom-measure-flow"
version = "0.1.0"
description = "Plugin Girder : sert la SPA d'annotation DICOM et ajoute un point d'entrée dans la vue item"
license = "Apache-2.0"
# Girder 5 : le plugin utilise `registerPluginStaticContent` et cible l'API 5.x.
# Le plancher python est celui de girder 5 lui-même.
requires-python = ">=3.10"
dependencies = [
    "girder>=5",
    # pydicom 3 : `Dataset.compress()` (transcodage avant envoi, cf. transcode.py) n'existe
    # qu'à partir de cette version pour autre chose que le RLE.
    "pydicom>=3",
    "numpy>=1.24",
    # Encodeurs des codecs servis au navigateur : JPEG-LS (sans perte, défaut) et
    # JPEG 2000 (avec perte, ratio réglable). Absents, le plugin retombe sur le RLE puis sur
    # l'envoi du fichier original — il fonctionne, mais sans le gain de bande passante.
    "pyjpegls>=1.2",
    "pylibjpeg-openjpeg>=2.2",
]

[project.optional-dependencies]
test = ["pytest", "pydicom>=3", "numpy>=1.24", "pyjpegls>=1.2", "pylibjpeg-openjpeg>=2.2"]

# Enregistrement du plugin auprès de Girder (entry point côté serveur).
[project.entry-points."girder.plugin"]
dicom_measure_flow = "girder_dicom_measure_flow:DicomMeasureFlowPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["girder_dicom_measure_flow"]

[tool.setuptools.package-data]
# Le bundle de la SPA (web/dist) est copié ici à la construction (cf. Makefile).
girder_dicom_measure_flow = ["web_dist/**/*"]
